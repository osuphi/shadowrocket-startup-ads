name: Sync reviewed module and precision routing

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    paths:
      - sync_module.py
      - reviewed_rules.json
      - test_sync.py
      - routing/sync_routing.py
      - routing/policy.json
      - routing/test_routing.py
      - .github/workflows/sync.yml

permissions:
  contents: write

concurrency:
  group: startup-module-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test bounded startup module selection
        run: python -m unittest -v test_sync.py
      - name: Test routing and functional protection boundaries
        run: python -m unittest discover -s routing -p test_routing.py -v
      - name: Regenerate reviewed startup module
        run: python sync_module.py --repository "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME"
      - name: Regenerate and validate precision routing
        run: python routing/sync_routing.py --repository "$GITHUB_REPOSITORY"
      - name: Commit only checked generated resources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- StartupAds.module UpdateStatus.json routing/Shadowrocket-Precision.conf routing/Status.json routing/lists/*.list routing/ads/ConservativeAds.list
          if ! git diff --cached --quiet; then
            git commit -m 'Update checked module and precision routing'
            git push
          fi
